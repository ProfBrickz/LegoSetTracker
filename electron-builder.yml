appId: com.electron.lego_set_tracker
productName: Lego_Set_Tracker
afterAllArtifactBuild: ./scripts/afterAllArtifactBuild.js
publish: null
files:
  - src/**/*
  - node_modules/**/*
  - package.json
  - LICENSE
  - RELEASE_NOTES.md

win:
  artifactName: "${productName}_${version}_Windows_${arch}.${ext}"
  icon: assets/logo.ico
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64, arm64]
    #! does not work in container
    # - target: msi
    #   arch: [x64, arm64]
    #!
    - target: 7z
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
    - target: tar.gz
      arch: [x64, arm64]
nsis:
  artifactName: "${productName}_${version}_Windows_Installer.exe"
  oneClick: false
  installerIcon: assets/logo.ico
  uninstallerIcon: assets/logo.ico
  license: LICENSE
  allowToChangeInstallationDirectory: true
nsisWeb:
  artifactName: "${productName}_${version}_Windows_Web_Installer.exe"
portable:
  artifactName: "${productName}_${version}_Windows_Portable.exe"
msi:
  artifactName: "${productName}_${version}_Windows_Installer_${arch}.${ext}"

linux:
  artifactName: "${productName}_${version}_Linux_${arch}.${ext}"
  category: Utility
  icon: assets/512x512.png
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: flatpak
      arch: [x64, arm64]
    #! does not work in container
    # - target: snap
    #   arch: [x64, arm64]
    #!
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
    - target: freebsd
      arch: [x64, arm64]
    - target: pacman
      arch: [x64, arm64]
    #! does not work in container
    # - target: p5p
    #   arch: [x64, arm64]
    #!
    - target: apk
      arch: [x64, arm64]
    - target: 7z
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
    - target: tar.gz
      arch: [x64, arm64]
flatpak:
  runtime: org.freedesktop.Platform
  runtimeVersion: 24.08
  sdk: org.freedesktop.Sdk
  base: org.electronjs.Electron2.BaseApp
  baseVersion: 24.08
